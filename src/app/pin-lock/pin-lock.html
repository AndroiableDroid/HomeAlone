<div class="pin-container">
  <div class="pin-card animate-fade-in">

    <!-- Header -->
    <div class="pin-header">
      <div class="lock-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="pin-title">{{ title }}</h1>
      <p class="pin-subtitle">{{ subtitle }}</p>
    </div>

    <!-- Dot indicators -->
    <div class="dots-row" [class.shake]="shakeError">
      <div *ngFor="let filled of dots; let i = index"
           class="dot" [class.dot-filled]="filled">
      </div>
    </div>

    <!-- Error message -->
    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

    <!-- Loading indicator -->
    <div class="loading-indicator" *ngIf="isLoading">
      <div class="spinner"></div>
    </div>

    <!-- Keypad -->
    <div class="keypad" *ngIf="!isLoading">
      <div class="key-row">
        <button class="key-btn" (click)="pressKey('1')"><span>1</span></button>
        <button class="key-btn" (click)="pressKey('2')"><span>2</span><sub>ABC</sub></button>
        <button class="key-btn" (click)="pressKey('3')"><span>3</span><sub>DEF</sub></button>
      </div>
      <div class="key-row">
        <button class="key-btn" (click)="pressKey('4')"><span>4</span><sub>GHI</sub></button>
        <button class="key-btn" (click)="pressKey('5')"><span>5</span><sub>JKL</sub></button>
        <button class="key-btn" (click)="pressKey('6')"><span>6</span><sub>MNO</sub></button>
      </div>
      <div class="key-row">
        <button class="key-btn" (click)="pressKey('7')"><span>7</span><sub>PQRS</sub></button>
        <button class="key-btn" (click)="pressKey('8')"><span>8</span><sub>TUV</sub></button>
        <button class="key-btn" (click)="pressKey('9')"><span>9</span><sub>WXYZ</sub></button>
      </div>
      <div class="key-row">
        <!-- Biometric button (left) -->
        <button class="key-btn key-bio" (click)="tryBiometric()"
                *ngIf="isBiometricAvailable && mode === 'verify'; else emptyKey">
          <svg *ngIf="biometricType === 'fingerprint'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
            <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
            <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
            <path d="M2 12a10 10 0 0 1 18-6"/>
            <path d="M2 16h.01"/>
            <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
            <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
            <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
            <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
          </svg>
          <svg *ngIf="biometricType === 'face'" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
          <span class="bio-label">{{ biometricType === 'fingerprint' ? 'Touch ID' : 'Face ID' }}</span>
        </button>
        <ng-template #emptyKey>
          <div class="key-btn key-empty"></div>
        </ng-template>

        <!-- 0 -->
        <button class="key-btn" (click)="pressKey('0')"><span>0</span></button>

        <!-- Backspace -->
        <button class="key-btn key-back" (click)="pressBackspace()">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Submit button (shows when PIN is long enough but not max) -->
    <button class="submit-btn" *ngIf="pin.length >= 4 && pin.length < maxPinLength && !isLoading"
            (click)="submitPin()">
      {{ mode === 'verify' ? 'Unlock' : mode === 'create' ? 'Next' : 'Confirm' }}
    </button>

  </div>
</div>
